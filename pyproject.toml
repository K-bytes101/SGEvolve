[project]
name = "sgevolve"
version = "0.1.0"
description = "HybridEvo — evolutionary code optimization (main / ALE-Bench / IndustryOR)"
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "requests>=2.31",
    "sqlmodel>=0.0.14",
]

[project.optional-dependencies]
ale-bench = [
    "ale-bench @ git+https://github.com/SakanaAI/ALE-Bench.git@v1.4.0",
]
industry-or = [
    "datasets>=2.14",
]
industry-or-modeling = [
    "gurobipy>=11",
]
all-experiments = [
    "ale-bench @ git+https://github.com/SakanaAI/ALE-Bench.git@v1.4.0",
    "datasets>=2.14",
    "gurobipy>=11",
]

[tool.uv]
package = false
